name: Release Print Agent

on:
  push:
    tags:
      - 'print-agent-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: local-print-agent/package-lock.json

      - name: Install dependencies
        working-directory: local-print-agent
        run: npm ci

      - name: Build Windows agent executable
        working-directory: local-print-agent
        run: npm run build:exe

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        working-directory: local-print-agent
        run: npm run build:installer

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xburger-print-agent-windows
          path: |
            local-print-agent/dist/xburger-print-agent.exe
            local-print-agent/installer/dist/XBurgerPrintAgent-Setup.exe

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            local-print-agent/dist/xburger-print-agent.exe
            local-print-agent/installer/dist/XBurgerPrintAgent-Setup.exe
          generate_release_notes: true
